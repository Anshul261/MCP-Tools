# docker-compose.yml
version: '3.8'

services:
  # Note: For Azure PostgreSQL, you don't need a local PostgreSQL service
  # This section is commented out since you're using Azure PostgreSQL
  # 
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-custom_agent_db}
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - custom-agent-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-agent-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database Configuration (Azure PostgreSQL)
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      
      # Azure OpenAI Configuration
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-2024-02-15-preview}
      
      # HuggingFace Configuration
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN}
      
      # External APIs
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      
      # Document Processing
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-rag_documents}
      DOCUMENTS_DIR: ${DOCUMENTS_DIR:-documents}
      CONVERTED_DOCS_DIR: ${CONVERTED_DOCS_DIR:-converted_docs}
      
      # API Configuration
      API_DEBUG: ${API_DEBUG:-false}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    volumes:
      - ./documents:/app/documents
      - ./converted_docs:/app/converted_docs
      # Mount source code for development (comment out for production)
      - .:/app
    # depends_on:
    #   - postgres  # Uncomment if using local PostgreSQL
    networks:
      - custom-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - custom-agent-network

networks:
  custom-agent-network:
    driver: bridge

volumes:
  # postgres_data:  # Uncomment if using local PostgreSQL
  documents_data:
  converted_docs_data: