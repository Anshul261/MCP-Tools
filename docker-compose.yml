version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agno_pgvector
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports:
      - "5532:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
    restart: always